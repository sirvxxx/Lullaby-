name: Build 26.3 Fabric

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (26.3 Fabric)
        working-directory: modern26
        run: |
          chmod +x gradlew
          ./gradlew ":26.3-fabric:build" --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-26.3-fabric
          path: modern26/versions/26.3-fabric/build/libs/DangoMusic-*-fabric.jar
          if-no-files-found: error
